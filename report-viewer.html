<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persona Report — Gather Labs</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="assets/marked.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a; --panel: #121218; --border: rgba(255,255,255,0.08);
      --text: #e6e6ee; --muted: #9a9ab0; --faint: #6b6b80;
      --accent: #f0c27a; --link: #74b9ff;
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'JetBrains Mono', 'SF Mono', monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans);
      -webkit-font-smoothing: antialiased; line-height: 1.65; }

    .topbar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px;
      padding: 14px 24px; background: rgba(10,10,10,0.85); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .topbar .brand { font-family: var(--serif); font-size: 22px; letter-spacing: 0.5px; }
    .topbar .crumb { font-family: var(--mono); font-size: 11px; color: var(--faint);
      text-transform: uppercase; letter-spacing: 1.5px; }
    .topbar .spacer { flex: 1; }
    .btn {
      font-family: var(--mono); font-size: 12px; letter-spacing: 0.5px; cursor: pointer;
      padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); text-decoration: none;
      transition: all 0.18s ease; white-space: nowrap;
    }
    .btn:hover { color: var(--text); border-color: rgba(255,255,255,0.22); }
    .btn--pdf { color: var(--accent); border-color: rgba(240,194,122,0.35); }
    .btn--pdf:hover { background: rgba(240,194,122,0.08); border-color: rgba(240,194,122,0.6); }

    .wrap { max-width: 820px; margin: 0 auto; padding: 48px 28px 120px; }
    .doc { font-size: 15.5px; }
    .doc h1, .doc h2, .doc h3, .doc h4 { font-family: var(--serif); font-weight: 400;
      line-height: 1.2; margin: 1.6em 0 0.5em; letter-spacing: 0.3px; }
    .doc h1 { font-size: 40px; margin-top: 0; }
    .doc h2 { font-size: 29px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .doc h3 { font-size: 22px; color: #f3f3f8; }
    .doc h4 { font-size: 17px; font-family: var(--mono); text-transform: uppercase;
      letter-spacing: 1px; color: var(--accent); }
    .doc p { margin: 0.9em 0; color: #d6d6e0; }
    .doc strong { color: #fff; font-weight: 600; }
    .doc em { color: var(--muted); }
    .doc a { color: var(--link); text-decoration: none; border-bottom: 1px solid rgba(116,185,255,0.3); }
    .doc ul, .doc ol { margin: 0.9em 0 0.9em 1.4em; }
    .doc li { margin: 0.35em 0; color: #d6d6e0; }
    .doc li::marker { color: var(--faint); }
    .doc hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
    .doc blockquote { border-left: 3px solid var(--accent); margin: 1em 0; padding: 4px 0 4px 18px;
      color: var(--muted); font-style: italic; }
    .doc code { font-family: var(--mono); font-size: 0.88em; background: rgba(255,255,255,0.06);
      padding: 2px 6px; border-radius: 4px; color: #f0c27a; }
    .doc pre { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; overflow-x: auto; margin: 1.2em 0; }
    .doc pre code { background: none; padding: 0; color: #cfd4e0; }
    .doc table { width: 100%; border-collapse: collapse; margin: 1.4em 0; font-size: 13.5px; }
    .doc th, .doc td { border: 1px solid var(--border); padding: 9px 12px; text-align: left; vertical-align: top; }
    .doc th { background: rgba(255,255,255,0.04); font-family: var(--mono); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.6px; color: var(--accent); font-weight: 500; }
    .doc tr:nth-child(even) td { background: rgba(255,255,255,0.015); }
    .state { font-family: var(--mono); font-size: 13px; color: var(--faint); padding: 60px 0; text-align: center; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand">gather</span>
    <span class="crumb">Persona Report</span>
    <span class="spacer"></span>
    <a class="btn btn--pdf" id="pdfBtn" style="display:none" target="_blank" rel="noopener">Download PDF ↗</a>
    <a class="btn" href="#" onclick="window.close();return false;">Close</a>
  </div>
  <div class="wrap">
    <div class="doc" id="doc"><div class="state">Loading report…</div></div>
  </div>
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var f = qs.get('f');
      var pdf = qs.get('pdf');
      var title = qs.get('title');
      if (title) document.title = title + ' — Persona Report — Gather Labs';
      if (pdf) {
        var b = document.getElementById('pdfBtn');
        b.href = pdf; b.style.display = '';
      }
      var docEl = document.getElementById('doc');
      // Only allow same-origin relative report paths
      if (!f || /^https?:|^\/\//i.test(f) || f.indexOf('..') !== -1) {
        docEl.innerHTML = '<div class="state">No report specified.</div>';
        return;
      }
      fetch(f).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      }).then(function (md) {
        marked.setOptions({ gfm: true, breaks: false });
        docEl.innerHTML = marked.parse(md);
      }).catch(function () {
        docEl.innerHTML = '<div class="state">Could not load this report.</div>';
      });
    })();
  </script>
</body>
</html>
