<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gather Labs</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── CSS Variables (Light / Editorial) ── */
    :root {
      --bg-primary: #faf8f3;       /* cream */
      --bg-secondary: #f5f0e8;     /* warm */
      --border-subtle: rgba(0, 0, 0, 0.06);
      --border-neutral: #e7e5e4;
      --text-primary: #1c1917;     /* ink */
      --text-secondary: #57534e;   /* ink-soft */
      --text-muted: #a8a29e;       /* ink-muted */
      --text-inactive: #a8a29e;
      --accent-emerald: #b45309;   /* amber (name kept for compatibility) */
      --accent-light: #fef3c7;
      --tab-active-bg: rgba(0, 0, 0, 0.06);
      --tab-hover-text: #1c1917;
      --radius-card: 12px;
      --radius-tab: 8px;
      --font-display: 'Fraunces', Georgia, serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
      --font-sans: 'Source Serif 4', Georgia, serif;
      --header-height: 64px;
    }

    /* ── Reset & Base ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Grain Overlay (editorial texture) ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    }

    /* ── Custom Scrollbar ── */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.12);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.22);
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: var(--header-height);
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(250, 248, 243, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .header-logo {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      text-decoration: none;
    }
    .header-logo .logo-dot { color: var(--accent-emerald); }

    /* ── Tab Navigation ── */
    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: none;
      background: none;
      color: var(--text-inactive);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      border-radius: var(--radius-tab);
      transition: all 0.2s ease;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .nav-tab:hover {
      color: var(--tab-hover-text);
    }

    .nav-tab.active {
      color: var(--text-primary);
      background: var(--tab-active-bg);
    }

    .nav-tab-number {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      opacity: 0.5;
      letter-spacing: 0.05em;
    }

    .nav-tab.active .nav-tab-number {
      opacity: 0.7;
    }

    /* ── Header Right Label ── */
    .header-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* ── Scene Containers ── */
    .scenes-wrapper {
      margin-top: var(--header-height);
      height: calc(100vh - var(--header-height));
      position: relative;
    }

    .scene {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .scene.active {
      opacity: 1;
      visibility: visible;
    }

    /* ── Scene Placeholder ── */
    .scene-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      flex-direction: column;
      gap: 12px;
    }

    .scene-placeholder-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }

    .scene-placeholder-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Scene Stub (for Tabs 03 + 04 "Coming soon") ── */
    .scene-stub {
      max-width: 520px;
      margin: 0 auto;
      padding: 0 32px;
      text-align: center;
    }
    .scene-stub .scene-placeholder-eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--accent-emerald);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .scene-stub .scene-placeholder-title {
      font-size: 44px;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .scene-stub .scene-placeholder-sub {
      text-transform: none;
      letter-spacing: 0;
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-secondary);
      max-width: 420px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a class="header-logo" href="/">gather</a>

    <nav class="nav-tabs">
      <button class="nav-tab active" data-scene="2">
        <span class="nav-tab-number">01</span> Who we serve
      </button>
      <button class="nav-tab" data-scene="3">
        <span class="nav-tab-number">02</span> Skills
      </button>
      <button class="nav-tab" data-scene="4">
        <span class="nav-tab-number">03</span> Hooks
      </button>
      <button class="nav-tab" data-scene="5">
        <span class="nav-tab-number">04</span> Autonomous Ops
      </button>
    </nav>

    <div class="header-label">Gather Labs</div>
  </header>

  <!-- Scenes -->
  <div class="scenes-wrapper">

    <div id="scene-2" class="scene active">
      <div class="scene-placeholder">
        <div class="scene-placeholder-title">Who we serve</div>
        <div class="scene-placeholder-sub">Loading...</div>
      </div>
    </div>

    <div id="scene-3" class="scene">
      <div class="scene-placeholder">
        <div class="scene-placeholder-title">Skills</div>
        <div class="scene-placeholder-sub">Loading...</div>
      </div>
    </div>

    <div id="scene-4" class="scene">
      <div class="scene-placeholder scene-stub">
        <div class="scene-placeholder-eyebrow">Coming soon</div>
        <div class="scene-placeholder-title">Hooks</div>
        <div class="scene-placeholder-sub">Multiple growth hooks per persona, validated in parallel via fake-door testing.</div>
      </div>
    </div>

    <div id="scene-5" class="scene">
      <div class="scene-placeholder">
        <div class="scene-placeholder-title">Autonomous Ops</div>
        <div class="scene-placeholder-sub">Loading...</div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      const tabs = document.querySelectorAll('.nav-tab');
      const scenes = document.querySelectorAll('.scene');

      function switchScene(index) {
        if (index < 2 || index > 5) return;

        tabs.forEach(tab => tab.classList.remove('active'));
        scenes.forEach(scene => scene.classList.remove('active'));

        const activeTab = document.querySelector(`.nav-tab[data-scene="${index}"]`);
        const activeScene = document.getElementById(`scene-${index}`);

        if (activeTab) activeTab.classList.add('active');
        if (activeScene) activeScene.classList.add('active');
      }

      // Click navigation
      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const sceneIndex = parseInt(tab.dataset.scene, 10);
          switchScene(sceneIndex);
        });
      });

      // Keyboard shortcuts 1-4
      document.addEventListener('keydown', (e) => {
        // Ignore if user is typing in an input/textarea
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;

        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= 4) {
          switchScene(num + 1);
        }
      });
    })();
  </script>

  <!-- Scene Scripts (cache-busted) -->
  <script src="scene-1-personas.js?v=20260414j"></script>
  <script src="scene-6-skills.js?v=20260414j"></script>
  <script src="scene-7-autoops.js?v=20260414j"></script>
  <script>
    // Scene mapping: scene-2 = Who we serve (personas), scene-3 = Skills (iframe),
    // scene-4 = Hooks stub, scene-5 = Autonomous Ops (live ops dashboard iframe).
    document.addEventListener('DOMContentLoaded', async () => {
      const s2 = document.getElementById('scene-2');
      if (s2 && typeof initScene1 === 'function') {
        s2.innerHTML = '';
        await initScene1(s2);
      }
      const s3 = document.getElementById('scene-3');
      if (s3 && typeof initScene6 === 'function') {
        s3.innerHTML = '';
        initScene6(s3);
      }
      const s5 = document.getElementById('scene-5');
      if (s5 && typeof initScene7 === 'function') {
        s5.innerHTML = '';
        initScene7(s5);
      }
      // Scene 4 stays as static "Coming soon: Hooks" stub.
    });
  </script>

</body>
</html>
