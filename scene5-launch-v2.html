<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scene 5 — Launch (v2)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%; overflow: hidden;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .scene {
      display: flex;
      height: 100%;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 280px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid rgba(38,38,38,0.5);
    }
    .sidebar-top { padding: 24px 20px 16px; }
    .sidebar-label {
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.2em; color: #525252;
      display: block; margin-bottom: 8px;
    }
    .sidebar-title { font-size: 15px; font-weight: 500; color: #fff; }

    .play-area { padding: 0 20px 20px; }
    .play-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 8px 0; background: #fff; color: #000;
      font-size: 14px; font-weight: 500; border: none; border-radius: 8px;
      cursor: pointer; font-family: inherit; transition: background 0.15s;
    }
    .play-btn:hover { background: #e5e5e5; }

    .timeline { flex: 1; overflow-y: auto; padding: 0 12px; }
    .timeline-inner { position: relative; }
    .track {
      position: absolute; left: 19px; top: 0; bottom: 0; width: 1px;
      background: rgba(38,38,38,0.6);
    }
    .track-fill {
      position: absolute; left: 19px; top: 0; width: 1px;
      background: rgba(52,211,153,0.4); transition: height 0.5s ease-out;
    }
    .node-btn {
      position: relative; display: flex; align-items: flex-start; gap: 12px;
      width: 100%; text-align: left; padding: 12px 8px; border-radius: 8px;
      border: none; background: transparent; cursor: pointer;
      font-family: inherit; transition: background 0.15s;
    }
    .node-btn:hover { background: rgba(38,38,38,0.15); }
    .node-btn.active { background: rgba(38,38,38,0.3); }
    .node-dot {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin-top: 2px;
    }
    .node-dot.past { background: rgba(52,211,153,0.3); border: 1px solid rgba(52,211,153,0.4); }
    .node-dot.active-dot { background: #fff; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    .node-dot.future { background: #262626; border: 1px solid #404040; }
    .dot-inner { width: 8px; height: 8px; border-radius: 50%; background: #000; }
    .dot-number { font-size: 8px; font-family: 'JetBrains Mono', monospace; color: #525252; }
    .node-label { min-width: 0; padding-top: 2px; }
    .node-title { font-size: 14px; font-weight: 500; color: #525252; }
    .node-title.active-t { color: #fff; }
    .node-title.past-t { color: #a3a3a3; }
    .node-sub { font-size: 11px; color: #525252; }
    .node-sub.active-s { color: #a3a3a3; }

    .counter { padding: 16px 20px; border-top: 1px solid rgba(38,38,38,0.5); }
    .counter-val {
      font-size: 14px; font-family: 'JetBrains Mono', monospace;
      color: #fff; font-variant-numeric: tabular-nums;
    }
    .slider {
      margin-top: 12px; width: 100%; height: 4px;
      -webkit-appearance: none; appearance: none;
      background: #262626; border-radius: 9999px; cursor: pointer; outline: none;
    }
    .slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      border-radius: 50%; background: #fff; cursor: pointer;
    }

    /* ── Main ── */
    .main { flex: 1; overflow-y: auto; }
    .content { max-width: 896px; margin: 0 auto; padding: 48px 40px; }

    /* ── Stage header ── */
    .stage-header { margin-bottom: 32px; }
    .stage-number {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: #555; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 8px;
    }
    .stage-title {
      font-family: 'Instrument Serif', Georgia, serif; font-size: 36px;
      font-weight: 400; color: #fff; letter-spacing: -0.02em;
    }

    /* ── Card ── */
    .card {
      background: rgba(23,23,23,0.4); border: 1px solid rgba(38,38,38,0.8);
      border-radius: 12px; overflow: hidden;
    }

    /* ── Desc text ── */
    .desc { color: #a3a3a3; font-size: 14px; line-height: 1.6; margin-bottom: 24px; max-width: 600px; }

    /* ── Annotation ── */
    .annotation {
      margin-top: 32px; padding-left: 16px;
      border-left: 2px solid rgba(64,64,64,0.4);
      opacity: 0; transform: translateX(-8px);
      animation: fadeInRight 0.4s ease-out 0.6s forwards;
    }
    .annotation-badge {
      display: inline-block; margin-bottom: 6px; padding: 2px 8px;
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em;
      font-family: 'JetBrains Mono', monospace; color: #737373;
      background: rgba(64,64,64,0.4); border-radius: 4px;
    }
    .annotation p { color: #737373; font-size: 14px; line-height: 1.6; }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes blurIn {
      from { opacity: 0; transform: scale(0.9); filter: blur(16px); }
      to   { opacity: 1; transform: scale(1); filter: blur(0px); }
    }
    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .fade-in { opacity: 0; animation: fadeIn 0.5s ease-out forwards; }

    /* ── Badges ── */
    .badge {
      padding: 2px 8px; font-size: 10px; font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.05em; border-radius: 4px;
    }
    .badge-pass { color: #34d399; background: rgba(52,211,153,0.1); }
    .badge-warn { color: #fbbf24; background: rgba(251,191,36,0.1); }

    /* ── Comparison table ── */
    .compare-table {
      width: 100%; border-collapse: collapse; margin-bottom: 24px;
      font-size: 13px;
    }
    .compare-table th {
      text-align: left; padding: 10px 16px; font-weight: 500;
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.1em; color: #525252;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .compare-table td {
      padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.03);
      color: #a3a3a3; vertical-align: top;
    }
    .compare-table td:first-child { color: #d4d4d4; font-weight: 500; }
    .compare-table .col-trad { color: #ef4444; opacity: 0.7; }
    .compare-table .col-gather { color: #34d399; }

    /* ── CJ Layer diagram ── */
    .cj-layer {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-radius: 8px; margin-bottom: 6px;
      transition: all 0.3s ease;
    }
    .cj-layer:hover { background: rgba(255,255,255,0.02); }
    .cj-layer-num {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      width: 20px; flex-shrink: 0; color: #404040;
    }
    .cj-layer-name { font-size: 13px; color: #d4d4d4; width: 120px; flex-shrink: 0; }
    .cj-layer-bar {
      flex: 1; height: 6px; border-radius: 3px; position: relative; overflow: hidden;
      background: rgba(38,38,38,0.6);
    }
    .cj-layer-fill { height: 100%; border-radius: 3px; transition: width 0.8s ease-out; }
    .cj-layer-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      width: 80px; text-align: right; flex-shrink: 0;
    }

    /* ── Infra stack visual ── */
    .infra-stack {
      position: relative; margin-bottom: 32px;
    }
    .infra-shared {
      background: rgba(52,211,153,0.04);
      border: 1px solid rgba(52,211,153,0.2);
      border-radius: 16px;
      padding: 24px;
      position: relative;
    }
    .infra-shared-label {
      position: absolute; top: -10px; left: 24px;
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: #34d399; background: #0a0a0a; padding: 0 8px;
    }
    .infra-services {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    }
    .infra-svc {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px;
      background: rgba(52,211,153,0.06);
      border: 1px solid rgba(52,211,153,0.15);
      font-size: 12px; font-family: 'JetBrains Mono', monospace;
      color: #a3a3a3;
      opacity: 0; transition: opacity 0.3s, transform 0.3s;
      transform: translateY(8px);
    }
    .infra-svc.visible { opacity: 1; transform: translateY(0); }
    .infra-svc-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    }
    .infra-svc-dot.live { background: #34d399; box-shadow: 0 0 6px rgba(52,211,153,0.5); }

    .infra-brands {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      margin-bottom: 16px;
    }
    .infra-brand-col {
      border-radius: 12px; padding: 20px; position: relative;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .infra-brand-col.visible { opacity: 1; transform: translateY(0); }
    .infra-brand-col.meow {
      background: rgba(251,146,60,0.04);
      border: 1px solid rgba(251,146,60,0.2);
    }
    .infra-brand-col.specter {
      background: rgba(139,92,246,0.04);
      border: 1px solid rgba(139,92,246,0.2);
    }
    .infra-brand-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    }
    .infra-brand-name {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 20px; color: #fff;
    }
    .infra-layer-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .infra-layer-row:last-child { border-bottom: none; }
    .infra-layer-label {
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      color: #525252; width: 80px; flex-shrink: 0; text-transform: uppercase;
      letter-spacing: 0.03em; padding-top: 2px;
    }
    .infra-layer-val {
      font-size: 12px; color: #a3a3a3; line-height: 1.4;
    }

    /* Connector lines */
    .infra-connectors {
      display: flex; justify-content: center; gap: 0; height: 32px;
      position: relative; margin-bottom: 0;
    }
    .infra-connector-line {
      width: 1px; height: 100%;
      position: absolute;
    }
    .infra-connector-line.left {
      left: 25%; background: rgba(251,146,60,0.3);
    }
    .infra-connector-line.right {
      left: 75%; background: rgba(139,92,246,0.3);
    }

    /* ── Grid ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; text-align: center; }

    /* ── Pills ── */
    .pill {
      display: inline-block; padding: 4px 12px; font-size: 12px;
      color: #d4d4d4; background: rgba(38,38,38,0.6);
      border: 1px solid rgba(64,64,64,0.5); border-radius: 9999px;
    }

    /* ── Option pills ── */
    .option {
      display: inline-block; padding: 4px 12px; font-size: 12px;
      border-radius: 9999px; transition: all 0.3s; color: #525252;
      background: transparent; border: 1px solid rgba(64,64,64,0.5); cursor: pointer;
    }
    .option.selected { color: #000; background: #fff; border-color: #fff; }

    /* ── Terminal ── */
    .terminal-chrome {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px; border-bottom: 1px solid rgba(38,38,38,0.6);
    }
    .terminal-dots { display: flex; gap: 6px; }
    .terminal-dots span { width: 10px; height: 10px; border-radius: 50%; }
    .terminal-filename {
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.05em; color: #404040; margin-left: 8px;
    }

    /* ── Pulse ── */
    .pulse-container { position: relative; display: inline-flex; width: 8px; height: 8px; }
    .pulse-ping {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: #34d399; opacity: 0.75;
      animation: ping 1s cubic-bezier(0,0,0.2,1) infinite;
    }
    .pulse-dot {
      position: relative; width: 8px; height: 8px; border-radius: 50%; background: #34d399;
    }

    /* ── Spinner ── */
    .spinner {
      width: 8px; height: 8px; border-top: 1px solid #525252;
      border-radius: 50%; animation: spin 0.6s linear infinite;
    }

    /* ── Gantt ── */
    .gantt { position: relative; overflow-x: auto; margin-bottom: 24px; }
    .gantt-lane-label {
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase; letter-spacing: 0.1em; color: #525252;
      padding: 6px 0 4px; border-bottom: 1px solid rgba(38,38,38,0.5); margin-bottom: 4px;
    }
    .gantt-row { position: relative; height: 28px; display: flex; align-items: center; }
    .gantt-bar {
      position: absolute; height: 20px; border-radius: 4px;
      display: flex; align-items: center; padding: 0 8px;
      font-size: 10px; font-family: 'JetBrains Mono', monospace;
      white-space: nowrap; overflow: hidden; cursor: pointer;
      transition: filter 0.15s, transform 0.15s;
    }
    .gantt-bar:hover { filter: brightness(1.3); transform: scaleY(1.15); z-index: 5; }
    .gantt-bar.bar-agent {
      background: rgba(52,211,153,0.25); border: 1px solid rgba(52,211,153,0.5); color: #34d399;
    }
    .gantt-bar.bar-human {
      background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.4); color: #fbbf24;
    }
    .gantt-bar.bar-gate {
      background: rgba(248,113,113,0.15); border: 1px solid rgba(248,113,113,0.4); color: #f87171;
    }
    .gantt-day-header {
      display: flex; font-size: 9px; font-family: 'JetBrains Mono', monospace;
      color: #404040; margin-bottom: 4px;
    }
    .gantt-legend {
      display: flex; gap: 16px; margin-bottom: 20px;
    }
    .gantt-legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; font-family: 'JetBrains Mono', monospace; color: #525252;
    }
    .gantt-legend-dot { width: 8px; height: 8px; border-radius: 2px; }
    .gantt-summary { display: flex; gap: 24px; padding: 16px 0; }
    .gantt-summary-stat { display: flex; flex-direction: column; gap: 2px; }
    .gantt-tooltip {
      position: fixed; z-index: 9999; pointer-events: none;
      padding: 12px 16px; background: rgba(23,23,23,0.95);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      font-size: 12px; min-width: 240px; max-width: 380px; white-space: normal;
    }

    /* ── Artifact checklist ── */
    .artifact-row {
      display: flex; align-items: center; gap: 12px; padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .artifact-row:last-child { border-bottom: none; }
    .artifact-check {
      width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .artifact-check.done { background: rgba(52,211,153,0.15); }
    .artifact-name { font-size: 13px; color: #d4d4d4; flex: 1; }
    .artifact-type {
      font-size: 10px; font-family: 'JetBrains Mono', monospace; color: #525252;
    }

    /* ── Portfolio brand cards ── */
    .portfolio-card {
      background: rgba(23,23,23,0.4); border: 1px solid rgba(38,38,38,0.8);
      border-radius: 12px; padding: 20px;
    }
    .portfolio-card.active-brand { border-color: rgba(52,211,153,0.4); }
    .portfolio-card.next-brand { border-color: rgba(99,102,241,0.3); border-style: dashed; }
    .portfolio-card.future-brand { border-color: rgba(64,64,64,0.3); border-style: dashed; opacity: 0.5; }
  </style>
</head>
<body>
<div class="scene" id="app"></div>

<script>
(function () {
  'use strict';

  /* ═══════════════════════════════════════════
     STAGES — Reframed narrative
     ═══════════════════════════════════════════ */

  const STAGES = [
    { key: 'brief',     number: '01', title: 'Launch Brief',            subtitle: 'Persona enters \u2014 engine maps the customer journey' },
    { key: 'infra',     number: '02', title: 'The Infrastructure',     subtitle: 'Same rails, different brand' },
    { key: 'generate',  number: '03', title: 'Launch Planning',         subtitle: 'Agents generate the variable layer in parallel' },
    { key: 'live',      number: '04', title: 'Live',                   subtitle: 'Bot connected, first subscriber can activate' },
    { key: 'machine',   number: '05', title: 'The Machine',            subtitle: 'One engine, many brands, shared rails' },
  ];

  /* ═══════════════════════════════════════════
     HELPERS
     ═══════════════════════════════════════════ */

  function el(tag, attrs) {
    const e = document.createElement(tag);
    const children = Array.prototype.slice.call(arguments, 2);
    if (attrs) {
      for (const k in attrs) {
        if (k === 'style' && typeof attrs[k] === 'object') Object.assign(e.style, attrs[k]);
        else if (k === 'className') e.className = attrs[k];
        else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else e.setAttribute(k, attrs[k]);
      }
    }
    children.forEach(function (c) {
      if (c == null) return;
      if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(String(c)));
      else if (Array.isArray(c)) c.forEach(function (ch) { if (ch) e.appendChild(ch); });
      else e.appendChild(c);
    });
    return e;
  }

  function html(tag, attrs, innerHTML) {
    const e = el(tag, attrs);
    e.innerHTML = innerHTML;
    return e;
  }

  function stageHeader(number, title) {
    return el('div', { className: 'stage-header' },
      el('div', { className: 'stage-number' }, 'Stage ' + number),
      el('div', { className: 'stage-title' }, title)
    );
  }

  function annotation(badge, text) {
    return el('div', { className: 'annotation' },
      el('span', { className: 'annotation-badge' }, badge),
      el('p', null, text)
    );
  }

  function card(attrs) {
    var children = Array.prototype.slice.call(arguments, 1);
    var c = el.apply(null, ['div', { className: 'card ' + ((attrs && attrs.className) || ''), style: attrs && attrs.style }].concat(children));
    return c;
  }

  function checkSvg(size, color) {
    var t = document.createElement('template');
    t.innerHTML = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" fill="none"><path d="' + (size <= 14 ? 'M3 7L6 10L11 4' : 'M5 13l4 4L19 7') + '" stroke="' + color + '" stroke-width="' + (size <= 14 ? '1.5' : '2.5') + '" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return t.content.firstChild;
  }

  /* ═══════════════════════════════════════════
     STAGE 1 — BRIEF IN (persona → journey mapping)
     ═══════════════════════════════════════════ */

  function buildBriefIn() {
    // Each mapping links a highlighted phrase in the brief to an artifact decision
    var mappings = [
      {
        signal: 'Audience distrusts institutions, manages digital footprint actively',
        artifact: 'Landing Page',
        decision: 'No testimonials, no social proof carousel. Lead with technical architecture. Dark UI, monospace type, zero stock photography.',
        file: 'page-spec.json',
        briefKey: 'hl-distrust', // matches data-hl on the brief
      },
      {
        signal: 'OPSEC community, values anonymity over convenience',
        artifact: 'Onboarding Flow',
        decision: 'Encrypted signup flow, no identity verification. Straight to eSIM and VPN activation \u2014 the privacy value-add is the first thing they touch.',
        file: 'journey-config.yaml',
        briefKey: 'hl-opsec',
      },
      {
        signal: 'Tone: dark, nocturnal, technical',
        artifact: 'Brand Voice',
        decision: 'Bot speaks like a sysadmin, not a customer service rep. No emoji. No exclamation marks. Terse, precise, assumes technical literacy.',
        file: 'brand.md',
        briefKey: 'hl-tone',
      },
      {
        signal: 'Value-add: E2E encrypted calls, zero-knowledge accounts',
        artifact: 'Product KB',
        decision: 'Knowledge base organized by threat model, not feature list. Sections: network-layer privacy, metadata protection, SIM-swap prevention.',
        file: 'product.md',
        briefKey: 'hl-valueadd',
      },
      {
        signal: 'Privacy audience won\u2019t trust without proof',
        artifact: 'FAQ & Objections',
        decision: '"How do I know you\u2019re not logging?" \u2014 answer with architecture, not promises. Reference zero-knowledge design, link to audit.',
        file: 'faq.md',
        briefKey: 'hl-trust',
      },
      {
        signal: 'Premium positioning ($49/mo), low price sensitivity',
        artifact: 'Plan Config',
        decision: 'Single plan, no tiers. Unlimited everything. No trial \u2014 this audience commits or doesn\u2019t.',
        file: 'plan-spec.json',
        briefKey: 'hl-price',
      },
    ];

    var timers = [];

    // Build mapping rows — start hidden, revealed by animation

      { name: 'Meow Mobile', segment: 'Identity specific', status: 'live', subs: '116', mrr: '$7.3K', color: '#34d399' },
      { name: 'Specter', segment: 'Identity specific', status: 'just launched', subs: '0', mrr: '$0', color: '#8b5cf6' },
      { name: 'Macro Brand #1', segment: 'Broadbased', status: 'next', subs: '\u2014', mrr: '\u2014', color: '#6366f1' },
    ];

    var segmentEls = segments.map(function (s, i) {
      return el('div', { style: {
        display: 'flex', alignItems: 'center', gap: '12px', padding: '10px 0',
        borderBottom: '1px solid rgba(255,255,255,0.03)',
        opacity: '0', animation: 'fadeInRight 0.3s ease-out ' + (0.4 + i * 0.08) + 's forwards',
      }},
        el('span', { style: { width: '4px', height: '24px', borderRadius: '2px', background: s.color, flexShrink: '0' } }),
        el('div', { style: { flex: '1' } },
          el('div', { style: { fontSize: '13px', color: '#d4d4d4', fontWeight: '500' } }, s.type),
          el('div', { style: { fontSize: '11px', color: '#525252' } }, 'e.g. ' + s.example)
        ),
        el('span', { style: { fontSize: '10px', fontFamily: "'JetBrains Mono', monospace", color: '#525252', width: '80px' } }, s.volume + ' vol'),
        el('span', { style: { fontSize: '10px', fontFamily: "'JetBrains Mono', monospace", color: '#525252', width: '80px' } }, s.speed)
      );
    });

    var brandCards = brands.map(function (b, i) {
      var cardClass = b.status === 'live' ? 'portfolio-card active-brand' : b.status === 'just launched' ? 'portfolio-card active-brand' : 'portfolio-card next-brand';
      return el('div', { className: cardClass, style: { opacity: '0', animation: 'fadeIn 0.4s ease-out ' + (0.8 + i * 0.15) + 's forwards' } },
        el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '12px' } },
          b.status === 'live' || b.status === 'just launched'
            ? el('span', { className: 'pulse-container' }, el('span', { className: 'pulse-ping' }), el('span', { className: 'pulse-dot' }))
            : el('span', { style: { width: '8px', height: '8px', borderRadius: '50%', background: '#404040' } }),
          el('span', { style: { fontSize: '10px', fontFamily: "'JetBrains Mono', monospace", textTransform: 'uppercase', color: b.status === 'next' ? '#6366f1' : '#34d399' } }, b.status)
        ),
        el('div', { style: { fontFamily: '"Instrument Serif", Georgia, serif', fontSize: '22px', color: '#fff', marginBottom: '4px' } }, b.name),
        el('div', { style: { fontSize: '11px', color: '#525252', marginBottom: '12px' } }, b.segment),
        el('div', { style: { display: 'flex', gap: '16px' } },
          el('div', null,
            el('span', { style: { fontSize: '16px', fontFamily: "'JetBrains Mono', monospace", color: '#fff' } }, b.subs),
            el('span', { style: { fontSize: '9px', fontFamily: "'JetBrains Mono', monospace", color: '#404040', display: 'block' } }, 'subs')
          ),
          el('div', null,
            el('span', { style: { fontSize: '16px', fontFamily: "'JetBrains Mono', monospace", color: '#fff' } }, b.mrr),
            el('span', { style: { fontSize: '9px', fontFamily: "'JetBrains Mono', monospace", color: '#404040', display: 'block' } }, 'mrr')
          )
        )
      );
    });

    var wrapper = el('div', { className: 'fade-in' },
      stageHeader('05', 'The Machine'),

      el('p', { className: 'desc' },
        'This isn\u2019t a one-off brand launch. It\u2019s a repeatable engine. Each new brand reuses 95% of infrastructure and varies the 5 customer-facing layers. The path to 250K subscribers isn\u2019t one brand growing linearly \u2014 it\u2019s multiple brands compounding on shared rails.'
      ),

      // Portfolio view
      el('div', { style: { marginBottom: '32px' } },
        el('span', { style: { display: 'block', marginBottom: '16px', fontSize: '10px', fontFamily: "'JetBrains Mono', monospace", textTransform: 'uppercase', letterSpacing: '0.1em', color: '#525252' } }, 'Portfolio'),
        el('div', { className: 'grid-3' }, brandCards)
      ),

      // Economics
      card({ style: { padding: '24px', marginBottom: '32px', opacity: '0', animation: 'fadeIn 0.4s ease-out 1.2s forwards' } },
        el('span', { style: { display: 'block', marginBottom: '16px', fontSize: '10px', fontFamily: "'JetBrains Mono', monospace", textTransform: 'uppercase', letterSpacing: '0.1em', color: '#404040' } }, 'Unit economics of the engine'),
        el('div', { className: 'grid-4' },
          el('div', null,
            el('span', { style: { fontSize: '28px', fontWeight: '300', color: '#fff', display: 'block' } }, '3'),
            el('span', { style: { fontSize: '10px', fontFamily: "'JetBrains Mono', monospace", color: '#404040', textTransform: 'uppercase', display: 'block', marginTop: '4px' } }, 'Days to launch')
          ),
          el('div', null,
            el('span', { style: { fontSize: '28px', fontWeight: '300', color: '#fff', display: 'block' } }, '95%'),
            el('span', { style: { fontSize: '10px', fontFamily: "'JetBrains Mono', monospace", color: '#404040', textTransform: 'uppercase', display: 'block', marginTop: '4px' } }, 'Infra reuse')
          ),
          el('div', null,
            el('span', { style: { fontSize: '28px', fontWeight: '300', color: '#fff', display: 'block' } }, '9'),
            el('span', { style: { fontSize: '10px', fontFamily: "'JetBrains Mono', monospace", color: '#404040', textTransform: 'uppercase', display: 'block', marginTop: '4px' } }, 'Artifacts / brand')
          ),
          el('div', null,
            el('span', { style: { fontSize: '28px', fontWeight: '300', color: '#fff', display: 'block' } }, '$0'),
            el('span', { style: { fontSize: '10px', fontFamily: "'JetBrains Mono', monospace", color: '#404040', textTransform: 'uppercase', display: 'block', marginTop: '4px' } }, 'Marginal infra cost')
          )
        )
      ),

      // Segment taxonomy
      el('div', { style: { marginBottom: '24px' } },
        el('span', { style: { display: 'block', marginBottom: '12px', fontSize: '10px', fontFamily: "'JetBrains Mono', monospace", textTransform: 'uppercase', letterSpacing: '0.1em', color: '#525252' } }, 'Segment types the engine supports'),
        card({ style: { padding: '16px' } }, segmentEls)
      ),

      annotation('The multiplier', 'Each brand added to the portfolio has near-zero marginal infrastructure cost. The engine generates the variable layer, the shared rails handle everything else. Meow proved the model. Specter is the first replication. The next macro brand targets high-volume segments.')
    );

    return wrapper;
  }

  /* ═══════════════════════════════════════════
     STAGE BUILDER MAP
     ═══════════════════════════════════════════ */

  var BUILDERS = [buildBriefIn, buildInfra, buildGenerate, buildLive, buildMachine];

  /* ═══════════════════════════════════════════
     INIT
     ═══════════════════════════════════════════ */

  var container = document.getElementById('app');
  var activeStage = 0;
  var currentEl = null;
  var stageButtons = [];
  var trackFill, counterVal, slider;
  var playing = false;
  var playTimer = null;
  var playBtn;

  // Sidebar
  var sidebar = el('div', { className: 'sidebar' });
  var sidebarTop = el('div', { className: 'sidebar-top' },
    el('span', { className: 'sidebar-label' }, 'Scene 05'),
    el('span', { className: 'sidebar-title' }, 'Launch')
  );
  sidebar.appendChild(sidebarTop);

  var playArea = el('div', { className: 'play-area' });
  playBtn = html('button', { className: 'play-btn' }, '\u25b6 Play');
  playBtn.addEventListener('click', togglePlay);
  playArea.appendChild(playBtn);
  sidebar.appendChild(playArea);

  var timeline = el('div', { className: 'timeline' });
  var timelineInner = el('div', { className: 'timeline-inner' });
  timelineInner.appendChild(el('div', { className: 'track' }));
  trackFill = el('div', { className: 'track-fill' });
  timelineInner.appendChild(trackFill);

  STAGES.forEach(function (stage, i) {
    var btn = el('button', { className: 'node-btn' + (i === 0 ? ' active' : '') });
    btn.addEventListener('click', function () { setStage(i); });
    var dot = el('div', { className: 'node-dot ' + (i === 0 ? 'active-dot' : 'future') });
    if (i === 0) dot.appendChild(el('div', { className: 'dot-inner' }));
    else dot.appendChild(el('span', { className: 'dot-number' }, stage.number));
    btn.appendChild(dot);
    var label = el('div', { className: 'node-label' },
      el('div', { className: 'node-title' + (i === 0 ? ' active-t' : '') }, stage.title),
      el('div', { className: 'node-sub' + (i === 0 ? ' active-s' : '') }, stage.subtitle)
    );
    btn.appendChild(label);
    timelineInner.appendChild(btn);
    stageButtons.push({ btn: btn, dot: dot, title: label.children[0], sub: label.children[1] });
  });
  timeline.appendChild(timelineInner);
  sidebar.appendChild(timeline);

  var counter = el('div', { className: 'counter' },
    el('div', { className: 'sidebar-label' }, 'Step')
  );
  counterVal = el('div', { className: 'counter-val' }, '1 / 5');
  counter.appendChild(counterVal);
  slider = el('input', { className: 'slider', type: 'range', min: '0', max: '4', value: '0', step: '1' });
  slider.addEventListener('input', function () { setStage(parseInt(slider.value, 10)); });
  counter.appendChild(slider);
  sidebar.appendChild(counter);

  // Main
  var mainWrap = el('div', { className: 'main' });
  var mainContent = el('div', { className: 'content' });
  mainWrap.appendChild(mainContent);

  container.appendChild(sidebar);
  container.appendChild(mainWrap);

  renderStage();

  function setStage(index) {
    if (index < 0 || index > 4) return;
    activeStage = index;
    updateTimeline();
    renderStage();
  }

  function updateTimeline() {
    stageButtons.forEach(function (s, i) {
      var isPast = i < activeStage;
      var isActive = i === activeStage;
      s.btn.className = 'node-btn' + (isActive ? ' active' : '');
      s.dot.className = 'node-dot ' + (isPast ? 'past' : isActive ? 'active-dot' : 'future');
      s.dot.innerHTML = '';
      if (isPast) s.dot.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6L5 8.5L9.5 3.5" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      else if (isActive) s.dot.appendChild(el('div', { className: 'dot-inner' }));
      else s.dot.appendChild(el('span', { className: 'dot-number' }, STAGES[i].number));
      s.title.className = 'node-title' + (isPast ? ' past-t' : isActive ? ' active-t' : '');
      s.sub.className = 'node-sub' + (isActive ? ' active-s' : '');
    });
    var pct = stageButtons.length > 1 ? (activeStage / (stageButtons.length - 1)) * 100 : 0;
    trackFill.style.height = pct + '%';
    counterVal.textContent = (activeStage + 1) + ' / 5';
    slider.value = activeStage;
  }

  function renderStage() {
    if (currentEl && currentEl._cleanup) currentEl._cleanup();
    mainContent.innerHTML = '';
    currentEl = BUILDERS[activeStage]();
    mainContent.appendChild(currentEl);
    mainWrap.scrollTop = 0;
  }

  function togglePlay() {
    playing = !playing;
    if (playing) {
      playBtn.innerHTML = '\u23F8 Pause';
      advance();
    } else {
      playBtn.innerHTML = '\u25b6 Play';
      clearTimeout(playTimer);
    }
  }

  function advance() {
    if (!playing) return;
    playTimer = setTimeout(function () {
      if (activeStage < 4) {
        setStage(activeStage + 1);
        advance();
      } else {
        playing = false;
        playBtn.innerHTML = '\u25b6 Play';
      }
    }, 8000);
  }
})();
</script>
</body>
</html>
